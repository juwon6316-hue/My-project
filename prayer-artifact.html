<title>아침·저녁 기도문</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#fff8ec;--fg:#33291c;--card:#ffffffcc;--accent:#d98324;--muted:#7a6a55;--fs:19px}
body.evening{--bg:#1c2438;--fg:#e8ecf5;--card:#27314bcc;--accent:#9fb4ff;--muted:#a3adc7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);transition:background .4s,color .4s;
  font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:var(--fs);line-height:1.9}
main{max-width:640px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{text-align:center;margin-bottom:16px}
.icon{font-size:48px}
h1{margin:4px 0;font-size:1.6em}
.sub{margin:0;color:var(--muted);font-size:.85em}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--accent);background:transparent;color:var(--fg);
  border-radius:12px;font:inherit;font-size:.9em;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
body.evening .tabs button[aria-selected="true"]{color:#1c2438}
.tools{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.tools button{border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:8px;padding:4px 12px;font:inherit;font-size:.8em;cursor:pointer}
section{background:var(--card);border-radius:16px;padding:16px 20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
section h2{margin:0 0 6px;font-size:.95em;color:var(--accent)}
section p{margin:.2em 0}
.closing{text-align:center;color:var(--accent);margin-top:28px}

#editor{background:var(--card);border-radius:16px;padding:16px 20px;margin-bottom:16px;font-size:.85em}
#editor[hidden]{display:none}
#editor label{display:block;margin:10px 0 4px;color:var(--accent)}
#editor textarea,#editor input{width:100%;font:inherit;font-size:1em;line-height:1.7;padding:10px;border-radius:10px;border:1px solid var(--muted);background:transparent;color:var(--fg)}
#editor .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#editor .row button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--muted);background:transparent;color:var(--fg);cursor:pointer}
#editor .row .primary{background:var(--accent);border-color:var(--accent);color:#fff}
body.evening #editor .row .primary{color:#1c2438}
.hint{color:var(--muted);margin:4px 0;font-size:.85em}
.tools #edit{margin-right:auto}

#sermon{background:var(--card);border-radius:16px;padding:16px 20px;margin-bottom:16px;font-size:.85em}
#sermon[hidden]{display:none}
#sermon label{display:block;margin:10px 0 4px;color:var(--accent)}
#sermon textarea,#sermon input{width:100%;font:inherit;font-size:1em;line-height:1.7;padding:10px;border-radius:10px;border:1px solid var(--muted);background:transparent;color:var(--fg)}
#sermon .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#sermon .row button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--muted);background:transparent;color:var(--fg);cursor:pointer}
#sermon .row .primary{background:var(--accent);border-color:var(--accent);color:#fff}
#sermon .row button:disabled{opacity:.5}
#sermon summary{cursor:pointer;color:var(--muted);margin-top:12px}
.tabs button{font-size:.85em}

</style>

  <main>
    <header>
      <div class="icon" id="icon" aria-hidden="true">☀️</div>
      <h1 id="title">아침 기도</h1>
      <p id="greeting" class="sub"></p>
    </header>

    <nav class="tabs" role="tablist" aria-label="기도 선택">
      <button role="tab" data-mode="morning" id="tab-morning">☀️ 아침</button>
      <button role="tab" data-mode="evening" id="tab-evening">🌙 저녁</button>
      <button role="tab" data-mode="sunday" id="tab-sunday">🙏 예배</button>
    </nav>

    <div class="tools">
      <button id="smaller" aria-label="글자 작게">가−</button>
      <button id="larger" aria-label="글자 크게">가+</button>
      <button id="edit" aria-label="기도문 편집">✏️ 편집</button>
    </div>

    <form id="editor" hidden>
      <p class="hint">제목 한 줄, 그 아래 기도 내용을 적고, 빈 줄로 단락을 나눠요. (아래 입력칸을 고쳐 쓰면 됩니다)</p>
      <label for="ed-body" id="ed-label">기도문</label>
      <textarea id="ed-body" rows="16"></textarea>
      <label for="ed-closing">마무리 문장</label>
      <input id="ed-closing" type="text">
      <div class="row">
        <button type="submit" class="primary">저장</button>
        <button type="button" id="ed-cancel">취소</button>
        <button type="button" id="ed-reset">처음 기도문으로</button>
      </div>
      <p class="hint">이 기기의 브라우저에만 저장돼요.</p>
    </form>

    <form id="sermon" hidden>
      <p class="hint">이번 주 설교 말씀 필기를 적으면, 그 내용에 맞는 묵상 기도문을 AI가 만들어 줘요.</p>
      <label for="sm-title">설교 제목·본문 (선택)</label>
      <input id="sm-title" type="text" placeholder="예) 믿음의 길 · 히브리서 11:1-6">
      <label for="sm-notes">설교 필기</label>
      <textarea id="sm-notes" rows="10" placeholder="들은 말씀, 마음에 남은 구절, 적용할 점을 자유롭게 적어요."></textarea>
      <div class="row">
        <button type="submit" class="primary" id="sm-go">묵상 기도문 만들기</button>
        <button type="button" id="sm-clear">지우기</button>
      </div>
      <p id="sm-status" class="hint" role="status"></p>
      <details id="sm-settings">
        <summary>AI 연결 설정 (처음 한 번)</summary>
        <p class="hint">Anthropic API 키가 필요해요. 키는 이 기기의 브라우저에만 저장되고, 설교 필기는 기도문을 만들 때 Anthropic으로 전송돼요.</p>
        <label for="sm-key">API 키</label>
        <input id="sm-key" type="password" autocomplete="off" placeholder="sk-ant-...">
        <div class="row"><button type="button" id="sm-keysave">키 저장</button><button type="button" id="sm-keydel">키 삭제</button></div>
      </details>
    </form>

    <article id="prayer" aria-live="polite"></article>
    <p id="closing" class="closing"></p>
  </main>
  
<script>
// 기도문 내용은 이 파일만 수정하면 됩니다.
// title: 제목, body: 문단 배열(각 항목이 한 문단)
window.PRAYERS = {
  morning: {
    label: "아침 기도",
    greeting: "새 아침을 여는 기도",
    items: [
      {
        title: "아침 감사",
        body: [
          "하나님 아버지, 새로운 하루를 선물로 주셔서 감사합니다.",
          "밤사이 평안히 쉬게 하시고, 다시 눈을 뜨게 하신 은혜에 감사드립니다."
        ]
      },
      {
        title: "오늘을 맡기는 기도",
        body: [
          "오늘 제가 만나는 사람들과 해야 할 일들을 주님께 맡깁니다.",
          "조급함 대신 평안을, 두려움 대신 용기를 주시고, 매 순간 주님의 인도하심을 따르게 하소서."
        ]
      },
      {
        title: "말과 행동을 지켜 주소서",
        body: [
          "제 입술의 말이 누군가에게 힘이 되게 하시고,",
          "제 손과 발이 사랑과 정직의 길을 걷게 하소서."
        ]
      },
      {
        title: "주님의 기도",
        body: [
          "하늘에 계신 우리 아버지,",
          "아버지의 이름이 거룩히 여김을 받으시오며,",
          "아버지의 나라가 임하시오며,",
          "아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지이다.",
          "오늘 우리에게 일용할 양식을 주옵시고,",
          "우리가 우리에게 죄지은 자를 용서하여 준 것같이 우리 죄를 용서하여 주옵시고,",
          "우리를 시험에 들게 하지 마옵시고 다만 악에서 구하옵소서.",
          "나라와 권능과 영광이 영원히 아버지께 있사옵나이다. 아멘."
        ]
      }
    ],
    closing: "예수님의 이름으로 기도드립니다. 아멘."
  },
  evening: {
    label: "저녁 기도",
    greeting: "하루를 마무리하는 기도",
    items: [
      {
        title: "하루의 감사",
        body: [
          "하나님 아버지, 오늘 하루도 지켜 주시고 인도해 주셔서 감사합니다.",
          "기쁜 일도 힘든 일도 모두 주님의 손 안에 있었음을 믿습니다."
        ]
      },
      {
        title: "돌아보며 고백하는 기도",
        body: [
          "오늘 제가 말과 행동으로 잘못한 일, 놓치고 지나친 사랑이 있다면 용서하여 주소서.",
          "또한 저에게 상처 준 사람들을 너그러운 마음으로 용서하게 하소서."
        ]
      },
      {
        title: "내려놓는 기도",
        body: [
          "오늘 다 마치지 못한 일과 마음의 걱정을 주님께 내려놓습니다.",
          "내일의 염려는 내일에 맡기고, 평안한 마음으로 쉼을 누리게 하소서."
        ]
      },
      {
        title: "함께하는 이들을 위한 기도",
        body: [
          "사랑하는 가족과 이웃, 아픈 사람과 외로운 사람들을 기억합니다.",
          "주님의 품 안에서 오늘 밤 평안히 쉬게 하시고, 위로와 회복을 허락하소서."
        ]
      },
      {
        title: "주님의 기도",
        body: [
          "하늘에 계신 우리 아버지,",
          "아버지의 이름이 거룩히 여김을 받으시오며,",
          "아버지의 나라가 임하시오며,",
          "아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지이다.",
          "오늘 우리에게 일용할 양식을 주옵시고,",
          "우리가 우리에게 죄지은 자를 용서하여 준 것같이 우리 죄를 용서하여 주옵시고,",
          "우리를 시험에 들게 하지 마옵시고 다만 악에서 구하옵소서.",
          "나라와 권능과 영광이 영원히 아버지께 있사옵나이다. 아멘."
        ]
      }
    ],
    closing: "편안한 잠을 주시는 주님께 감사드리며, 예수님의 이름으로 기도드립니다. 아멘."
  }
};

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function defaultMode() {
    var h = new Date().getHours();
    return (h >= 5 && h < 15) ? "morning" : "evening"; // 5시~15시 아침, 그 외 저녁
  }

  window.PRAYERS.sunday = { label: "예배 묵상 기도", greeting: "이번 주 말씀을 따라 드리는 기도", items: [], closing: "" };
  var DEFAULTS = JSON.parse(JSON.stringify(window.PRAYERS));
  var current = "morning";

  function loadCustom() {
    var raw = store.get("customPrayers");
    if (!raw) return;
    try {
      var c = JSON.parse(raw);
      ["morning", "evening"].forEach(function (m) {
        if (c[m] && c[m].items && c[m].items.length) {
          window.PRAYERS[m].items = c[m].items;
          if (typeof c[m].closing === "string") window.PRAYERS[m].closing = c[m].closing;
        }
      });
    } catch (e) {}
  }
  function saveCustom() {
    var out = {};
    ["morning", "evening"].forEach(function (m) {
      out[m] = { items: window.PRAYERS[m].items, closing: window.PRAYERS[m].closing };
    });
    store.set("customPrayers", JSON.stringify(out));
  }
  function toText(items) {
    return items.map(function (it) { return it.title + "\n" + it.body.join("\n"); }).join("\n\n");
  }
  function parseText(t) {
    return t.split(/\n\s*\n/).map(function (blk) {
      var lines = blk.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
      return lines.length ? { title: lines[0], body: lines.slice(1) } : null;
    }).filter(Boolean);
  }

  function render(mode) {
    current = mode;
    $("editor").hidden = true;
    $("sermon").hidden = mode !== "sunday";
    $("edit").hidden = mode === "sunday";
    if (mode === "sunday") loadWeek();
    var p = window.PRAYERS[mode];
    document.body.className = mode === "evening" ? "evening" : "morning";
    $("icon").textContent = mode === "morning" ? "☀️" : mode === "evening" ? "🌙" : "🙏";
    $("title").textContent = p.label;
    $("greeting").textContent = p.greeting;
    $("closing").textContent = p.closing;
    var box = $("prayer");
    box.textContent = "";
    p.items.forEach(function (it) {
      var s = document.createElement("section");
      var h = document.createElement("h2");
      h.textContent = it.title;
      s.appendChild(h);
      it.body.forEach(function (t) {
        var para = document.createElement("p");
        para.textContent = t;
        s.appendChild(para);
      });
      box.appendChild(s);
    });
    ["morning", "evening", "sunday"].forEach(function (m) {
      $("tab-" + m).setAttribute("aria-selected", m === mode ? "true" : "false");
    });
    
    window.scrollTo(0, 0);
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { render(b.dataset.mode); });
  });

  $("edit").addEventListener("click", function () {
    var p = window.PRAYERS[current];
    $("ed-label").textContent = p.label + " 내용";
    $("ed-body").value = toText(p.items);
    $("ed-closing").value = p.closing;
    $("editor").hidden = false;
    $("ed-body").focus();
  });
  $("ed-cancel").addEventListener("click", function () { $("editor").hidden = true; });
  $("ed-reset").addEventListener("click", function () {
    var d = DEFAULTS[current];
    $("ed-body").value = toText(d.items);
    $("ed-closing").value = d.closing;
  });
  $("editor").addEventListener("submit", function (e) {
    e.preventDefault();
    var items = parseText($("ed-body").value);
    if (!items.length) { $("ed-body").focus(); return; }
    window.PRAYERS[current].items = items;
    window.PRAYERS[current].closing = $("ed-closing").value.trim();
    saveCustom();
    render(current);
  });

  // ---- 예배 묵상 기도 (AI) ----
  function weekKey() {
    var d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return "sermon:" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }
  function loadWeek() {
    var raw = store.get(weekKey()), w = null;
    try { w = raw ? JSON.parse(raw) : null; } catch (e) {}
    $("sm-title").value = w ? w.title || "" : "";
    $("sm-notes").value = w ? w.notes || "" : "";
    window.PRAYERS.sunday.items = w ? w.items || [] : [];
    window.PRAYERS.sunday.closing = w ? w.closing || "" : "";
    $("sm-status").textContent = w && w.items && w.items.length ? "이번 주에 만든 기도문이에요." : "";
    $("sm-settings").open = !store.get("apiKey");
    $("sm-key").value = "";
  }
  $("sm-keysave").addEventListener("click", function () {
    var k = $("sm-key").value.trim();
    if (!k) return;
    store.set("apiKey", k); $("sm-key").value = ""; $("sm-settings").open = false;
    $("sm-status").textContent = "키를 저장했어요.";
  });
  $("sm-keydel").addEventListener("click", function () {
    try { localStorage.removeItem("apiKey"); } catch (e) {}
    $("sm-status").textContent = "키를 삭제했어요.";
  });
  $("sm-clear").addEventListener("click", function () {
    try { localStorage.removeItem(weekKey()); } catch (e) {}
    loadWeek(); render("sunday");
  });
  var PROMPT = "당신은 교회 예배 후 묵상을 돕는 기도 동반자입니다. 아래 설교 필기를 바탕으로 한국어 묵상 기도문을 써 주세요.\n" +
    "규칙:\n- 필기에 없는 성경 구절이나 사실을 지어내지 말고, 필기의 내용과 본문에 충실하세요.\n" +
    "- 따뜻하고 경건한 1인칭 기도체(\"~하소서\", \"~합니다\")로 쓰세요.\n" +
    "- 4~5개 단락으로 나누고, 각 단락은 '제목 한 줄' 다음에 2~4줄의 기도 내용을 쓰세요. 단락 사이는 빈 줄 하나로 구분하세요.\n" +
    "- 흐름: 말씀에 대한 감사 → 말씀 속에서 마음에 새긴 것 → 회개와 결단 → 이번 주 삶의 적용 → 이웃·교회를 위한 기도.\n" +
    "- 마지막에 빈 줄 후 '마무리: '로 시작하는 한 줄(예수님의 이름으로 드리는 문장)을 쓰세요.\n" +
    "- 마크다운 기호(#, *, - 등)와 설명은 쓰지 말고 기도문 본문만 출력하세요.";
  $("sermon").addEventListener("submit", function (e) {
    e.preventDefault();
    var notes = $("sm-notes").value.trim(), title = $("sm-title").value.trim(), key = store.get("apiKey");
    var st = $("sm-status"), btn = $("sm-go");
    if (!notes) { st.textContent = "설교 필기를 먼저 적어 주세요."; return; }
    if (!key) { st.textContent = "아래 'AI 연결 설정'에서 API 키를 먼저 저장해 주세요."; $("sm-settings").open = true; return; }
    btn.disabled = true; st.textContent = "기도문을 만드는 중이에요… (10~30초)";
    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json", "x-api-key": key,
        "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-5-5", max_tokens: 1800, system: PROMPT,
        messages: [{ role: "user", content: (title ? "설교 제목·본문: " + title + "\n\n" : "") + "설교 필기:\n" + notes }]
      })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(r.status === 401 ? "API 키가 올바르지 않아요." : (j && j.error && j.error.message) || ("오류 " + r.status));
        return j;
      });
    }).then(function (j) {
      var text = (j.content || []).map(function (b) { return b.text || ""; }).join("").trim();
      var closing = "", m = text.match(/\n?\s*마무리:\s*([^\n]+)\s*$/);
      if (m) { closing = m[1].trim(); text = text.slice(0, m.index).trim(); }
      var items = parseText(text);
      if (!items.length) throw new Error("기도문을 받지 못했어요. 다시 시도해 주세요.");
      store.set(weekKey(), JSON.stringify({ title: title, notes: notes, items: items, closing: closing }));
      window.PRAYERS.sunday.items = items; window.PRAYERS.sunday.closing = closing;
      render("sunday");
      $("sm-status").textContent = "기도문을 만들었어요. 아래에서 읽어 보세요.";
    }).catch(function (err) {
      st.textContent = "만들지 못했어요: " + (err && err.message ? err.message : "네트워크를 확인해 주세요.");
    }).then(function () { btn.disabled = false; });
  });

  var fs = parseInt(store.get("fs"), 10) || 19;
  function setFs(n) {
    fs = Math.max(14, Math.min(34, n));
    document.documentElement.style.setProperty("--fs", fs + "px");
    store.set("fs", fs);
  }
  $("smaller").addEventListener("click", function () { setFs(fs - 2); });
  $("larger").addEventListener("click", function () { setFs(fs + 2); });
  setFs(fs);

  loadCustom();
  render(defaultMode());
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
})();

</script>
