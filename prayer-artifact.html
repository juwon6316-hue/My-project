<title>아침·저녁 기도문</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#fff8ec;--fg:#33291c;--card:#ffffffcc;--accent:#d98324;--muted:#7a6a55;--fs:19px}
body.evening{--bg:#1c2438;--fg:#e8ecf5;--card:#27314bcc;--accent:#9fb4ff;--muted:#a3adc7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);transition:background .4s,color .4s;
  font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;font-size:var(--fs);line-height:1.9}
main{max-width:640px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{text-align:center;margin-bottom:16px}
.icon{font-size:48px}
h1{margin:4px 0;font-size:1.6em}
.sub{margin:0;color:var(--muted);font-size:.85em}
.tabs{display:flex;gap:8px;margin:20px 0 12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--accent);background:transparent;color:var(--fg);
  border-radius:12px;font:inherit;font-size:.9em;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
body.evening .tabs button[aria-selected="true"]{color:#1c2438}
.tools{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.tools button{border:1px solid var(--muted);background:transparent;color:var(--fg);border-radius:8px;padding:4px 12px;font:inherit;font-size:.8em;cursor:pointer}
section{background:var(--card);border-radius:16px;padding:16px 20px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
section h2{margin:0 0 6px;font-size:.95em;color:var(--accent)}
section p{margin:.2em 0}
.closing{text-align:center;color:var(--accent);margin-top:28px}

</style>

  <main>
    <header>
      <div class="icon" id="icon" aria-hidden="true">☀️</div>
      <h1 id="title">아침 기도</h1>
      <p id="greeting" class="sub"></p>
    </header>

    <nav class="tabs" role="tablist" aria-label="기도 선택">
      <button role="tab" data-mode="morning" id="tab-morning">☀️ 아침</button>
      <button role="tab" data-mode="evening" id="tab-evening">🌙 저녁</button>
    </nav>

    <div class="tools">
      <button id="smaller" aria-label="글자 작게">가−</button>
      <button id="larger" aria-label="글자 크게">가+</button>
    </div>

    <article id="prayer" aria-live="polite"></article>
    <p id="closing" class="closing"></p>
  </main>
  
<script>
// 기도문 내용은 이 파일만 수정하면 됩니다.
// title: 제목, body: 문단 배열(각 항목이 한 문단)
window.PRAYERS = {
  morning: {
    label: "아침 기도",
    greeting: "새 아침을 여는 기도",
    items: [
      {
        title: "아침 감사",
        body: [
          "하나님 아버지, 새로운 하루를 선물로 주셔서 감사합니다.",
          "밤사이 평안히 쉬게 하시고, 다시 눈을 뜨게 하신 은혜에 감사드립니다."
        ]
      },
      {
        title: "오늘을 맡기는 기도",
        body: [
          "오늘 제가 만나는 사람들과 해야 할 일들을 주님께 맡깁니다.",
          "조급함 대신 평안을, 두려움 대신 용기를 주시고, 매 순간 주님의 인도하심을 따르게 하소서."
        ]
      },
      {
        title: "말과 행동을 지켜 주소서",
        body: [
          "제 입술의 말이 누군가에게 힘이 되게 하시고,",
          "제 손과 발이 사랑과 정직의 길을 걷게 하소서."
        ]
      },
      {
        title: "주님의 기도",
        body: [
          "하늘에 계신 우리 아버지,",
          "아버지의 이름이 거룩히 여김을 받으시오며,",
          "아버지의 나라가 임하시오며,",
          "아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지이다.",
          "오늘 우리에게 일용할 양식을 주옵시고,",
          "우리가 우리에게 죄지은 자를 용서하여 준 것같이 우리 죄를 용서하여 주옵시고,",
          "우리를 시험에 들게 하지 마옵시고 다만 악에서 구하옵소서.",
          "나라와 권능과 영광이 영원히 아버지께 있사옵나이다. 아멘."
        ]
      }
    ],
    closing: "예수님의 이름으로 기도드립니다. 아멘."
  },
  evening: {
    label: "저녁 기도",
    greeting: "하루를 마무리하는 기도",
    items: [
      {
        title: "하루의 감사",
        body: [
          "하나님 아버지, 오늘 하루도 지켜 주시고 인도해 주셔서 감사합니다.",
          "기쁜 일도 힘든 일도 모두 주님의 손 안에 있었음을 믿습니다."
        ]
      },
      {
        title: "돌아보며 고백하는 기도",
        body: [
          "오늘 제가 말과 행동으로 잘못한 일, 놓치고 지나친 사랑이 있다면 용서하여 주소서.",
          "또한 저에게 상처 준 사람들을 너그러운 마음으로 용서하게 하소서."
        ]
      },
      {
        title: "내려놓는 기도",
        body: [
          "오늘 다 마치지 못한 일과 마음의 걱정을 주님께 내려놓습니다.",
          "내일의 염려는 내일에 맡기고, 평안한 마음으로 쉼을 누리게 하소서."
        ]
      },
      {
        title: "함께하는 이들을 위한 기도",
        body: [
          "사랑하는 가족과 이웃, 아픈 사람과 외로운 사람들을 기억합니다.",
          "주님의 품 안에서 오늘 밤 평안히 쉬게 하시고, 위로와 회복을 허락하소서."
        ]
      },
      {
        title: "주님의 기도",
        body: [
          "하늘에 계신 우리 아버지,",
          "아버지의 이름이 거룩히 여김을 받으시오며,",
          "아버지의 나라가 임하시오며,",
          "아버지의 뜻이 하늘에서와 같이 땅에서도 이루어지이다.",
          "오늘 우리에게 일용할 양식을 주옵시고,",
          "우리가 우리에게 죄지은 자를 용서하여 준 것같이 우리 죄를 용서하여 주옵시고,",
          "우리를 시험에 들게 하지 마옵시고 다만 악에서 구하옵소서.",
          "나라와 권능과 영광이 영원히 아버지께 있사옵나이다. 아멘."
        ]
      }
    ],
    closing: "편안한 잠을 주시는 주님께 감사드리며, 예수님의 이름으로 기도드립니다. 아멘."
  }
};

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function defaultMode() {
    var h = new Date().getHours();
    return (h >= 5 && h < 15) ? "morning" : "evening"; // 5시~15시 아침, 그 외 저녁
  }

  function render(mode) {
    var p = window.PRAYERS[mode];
    document.body.className = mode;
    $("icon").textContent = mode === "morning" ? "☀️" : "🌙";
    $("title").textContent = p.label;
    $("greeting").textContent = p.greeting;
    $("closing").textContent = p.closing;
    var box = $("prayer");
    box.textContent = "";
    p.items.forEach(function (it) {
      var s = document.createElement("section");
      var h = document.createElement("h2");
      h.textContent = it.title;
      s.appendChild(h);
      it.body.forEach(function (t) {
        var para = document.createElement("p");
        para.textContent = t;
        s.appendChild(para);
      });
      box.appendChild(s);
    });
    ["morning", "evening"].forEach(function (m) {
      $("tab-" + m).setAttribute("aria-selected", m === mode ? "true" : "false");
    });
    
    window.scrollTo(0, 0);
  }

  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () { render(b.dataset.mode); });
  });

  var fs = parseInt(store.get("fs"), 10) || 19;
  function setFs(n) {
    fs = Math.max(14, Math.min(34, n));
    document.documentElement.style.setProperty("--fs", fs + "px");
    store.set("fs", fs);
  }
  $("smaller").addEventListener("click", function () { setFs(fs - 2); });
  $("larger").addEventListener("click", function () { setFs(fs + 2); });
  setFs(fs);

  render(defaultMode());
})();

</script>
