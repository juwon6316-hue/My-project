<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b3a55">
  <title>아침·저녁 기도문</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="morning">
  <main>
    <header>
      <div class="icon" id="icon" aria-hidden="true">☀️</div>
      <h1 id="title">아침 기도</h1>
      <p id="greeting" class="sub"></p>
    </header>

    <nav class="tabs" role="tablist" aria-label="기도 선택">
      <button role="tab" data-mode="morning" id="tab-morning">☀️ 아침</button>
      <button role="tab" data-mode="evening" id="tab-evening">🌙 저녁</button>
    </nav>

    <div class="tools">
      <button id="smaller" aria-label="글자 작게">가−</button>
      <button id="larger" aria-label="글자 크게">가+</button>
    </div>

    <article id="prayer" aria-live="polite"></article>
    <p id="closing" class="closing"></p>
  </main>
  <script src="prayers.js"></script>
  <script src="script.js"></script>
</body>
</html>
